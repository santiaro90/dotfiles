# Prefix: ctrl-s (requires `stty -ixon`, set in zshrc, or this collides with terminal flow control)
set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start indices at 1, keep them contiguous as windows close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse off
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

# Pane splitting/nav, mirroring the wezterm leader bindings
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle windows, new window
unbind n
bind [ previous-window
bind ] next-window
bind t new-window -c "#{pane_current_path}"

# Session picker. Login shell so the popup gets the same fzf layout as ctrl-o.
bind o display-popup -E -w 80% -h 80% "zsh -lic sesh-pick"

# Copy mode: nvim-style visual selection (hjkl move, v/V/C-v select, y yank).
# Yank goes to the tmux paste buffer and the system clipboard.
setw -g mode-keys vi
bind Enter copy-mode
bind p paste-buffer
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Default vi Escape only clears selection; ctrl+[ (=Escape) should exit copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel

# Pane resize mode: prefix+r then h/j/k/l, Enter/Escape/q to exit.
# tmux drops back to the root table after every key, so each resize re-enters
# the table to keep the mode sticky.
bind r switch-client -T resize
bind -T resize h resize-pane -L 2 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize l resize-pane -R 2 \; switch-client -T resize
bind -T resize Enter switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

# Status bar: catppuccin frappe, matching the nvim lualine/bufferline look.
# Window names only, current window highlighted instead of tmux's "*" flag.
set -g status-position top
set -g status-style "bg=#292c3c"
set -g status-left ""
set -g status-left-length 0
set -g status-right "#{?#{==:#{client_key_table},resize},#[bg=#a6d190#,fg=#232634#,bold] RESIZE #[default],}"
set -g status-right-length 20
setw -g window-status-format "#[bg=#51576d,fg=#b5bfe2] #I #[bg=#292c3c,fg=#a5adce] #W "
setw -g window-status-current-format "#[bg=#e78284,fg=#232634,bold] #I #[bg=#626880,fg=#c6d0f5,bold] #W "
